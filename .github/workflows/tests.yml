name: test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  schedule:
    # Run every Monday at 6am UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    permissions:
      id-token: write
    with:
      submodules: false
      coverage: ""
      envs: |
        - name: Python 3.11
          linux: py311-test
          posargs: -v

        - name: Python 3.12
          linux: py312-test
          posargs: -v

        - name: Python 3.13
          linux: py313-test
          posargs: -v

        - name: Python 3.14
          linux: py314-test
          posargs: -v

        - name: Python 3.15 with coverage
          linux: py315-test-cov
          posargs: -v
          coverage: codecov-oidc

        - name: Python 3.15 (macOS)
          macos: py315-test
          posargs: -v

        - name: Python 3.15 (Windows)
          windows: py315-test
          posargs: -v

        - name: Python 3.15 with dev version of dependencies
          linux: py315-test-devdeps
          posargs: -v
